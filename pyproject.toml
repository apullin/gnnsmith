[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnnsmith"
version = "0.1.0"
description = "Z3-constrained GNN synthesis, metamorphic/differential fuzzing, and WhiteFox white-box testing for PyTorch Geometric & graph ML libraries."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "z3-solver>=4.12",
]

[project.scripts]
gnnsmith = "gnnsmith.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gnnsmith"]
